<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmacia - Registro</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-x-hidden antialiased">

  <!-- Ambient background glow elements -->
  <div class="absolute -top-24 -left-24 w-96 h-96 bg-emerald-100/60 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-teal-100/60 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Main Centralized Card -->
  <main class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/70 border border-slate-100 p-8 sm:p-10 z-10 relative">
    
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 text-white shadow-lg shadow-emerald-500/30 mb-4 transform transition hover:scale-105">
        <i class="fa-solid fa-user-plus text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Crear Cuenta</h1>
      <p class="text-slate-500 text-sm mt-1">Regístrate para acceder al Portal Farmacéutico</p>
    </div>

    <!-- Form (Preserving ID and DOM layout for app.js) -->
    <form id="registroForm" class="space-y-4">
      
      <!-- Full Name Field -->
      <div>
        <label for="nombre" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Nombre Completo</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-regular fa-user text-base"></i>
          </div>
          <input 
            type="text" 
            id="nombre" 
            placeholder="Nombre completo" 
            required 
            class="w-full pl-10 pr-4 py-3 bg-slate-50/60 border border-slate-200 rounded-xl text-slate-800 text-sm placeholder-slate-400 focus:outline-none focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200"
          >
        </div>
      </div>

      <!-- Email Field -->
      <div>
        <label for="email" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Correo Electrónico</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-regular fa-envelope text-base"></i>
          </div>
          <input 
            type="email" 
            id="email" 
            placeholder="Correo electrónico" 
            required 
            class="w-full pl-10 pr-4 py-3 bg-slate-50/60 border border-slate-200 rounded-xl text-slate-800 text-sm placeholder-slate-400 focus:outline-none focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200"
          >
        </div>
      </div>

      <!-- Password Field -->
      <div>
        <label for="password" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Contraseña</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-lock text-base"></i>
          </div>
          <input 
            type="password" 
            id="password" 
            placeholder="Contraseña (mín. 6 caracteres)" 
            required 
            minlength="6" 
            class="w-full pl-10 pr-11 py-3 bg-slate-50/60 border border-slate-200 rounded-xl text-slate-800 text-sm placeholder-slate-400 focus:outline-none focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200"
          >
          <!-- Password Visibility Toggle Button -->
          <button 
            type="button" 
            id="togglePassword" 
            aria-label="Mostrar u ocultar contraseña"
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors focus:outline-none"
          >
            <i class="fa-regular fa-eye" id="toggleIcon"></i>
          </button>
        </div>
      </div>

      <!-- Role Selector Field -->
      <div>
        <label for="rol" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Rol de Usuario</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-user-shield text-base"></i>
          </div>
          <select 
            id="rol" 
            class="w-full pl-10 pr-10 py-3 bg-slate-50/60 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200 appearance-none cursor-pointer"
          >
            <option value="usuario">Usuario</option>
            <option value="moderador">Moderador</option>
            <option value="admin">Administrador</option>
          </select>
          <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-chevron-down text-xs"></i>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-700 hover:to-teal-600 text-white font-semibold text-sm rounded-xl shadow-md shadow-emerald-600/20 hover:shadow-lg hover:shadow-emerald-600/30 active:scale-[0.99] transition duration-200 flex items-center justify-center gap-2 pt-3 mt-4"
      >
        <i class="fa-solid fa-check text-sm"></i>
        <span>Registrarse</span>
      </button>
    </form>

    <!-- Dynamic feedback message output element (ID "mensaje" strictly preserved) -->
    <div class="mt-4 text-center min-h-[24px]">
      <p id="mensaje" class="text-sm font-medium transition-all duration-200"></p>
    </div>

    <!-- Login Link -->
    <div class="mt-6 pt-6 border-t border-slate-100 text-center">
      <p class="text-xs text-slate-500">
        ¿Ya tienes cuenta? 
        <a href="index.html" class="font-semibold text-emerald-600 hover:text-emerald-700 hover:underline transition-colors ml-1">Inicia sesión aquí</a>
      </p>
    </div>
  </main>

  <!-- Visual script for interactive password reveal -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const togglePasswordBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');

      if (togglePasswordBtn && passwordInput && toggleIcon) {
        togglePasswordBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          
          toggleIcon.classList.toggle('fa-eye', !isPassword);
          toggleIcon.classList.toggle('fa-eye-slash', isPassword);
        });
      }
    });
  </script>

  <!-- Backend logic script import (Kept intact) -->
  <script src="app.js"></script>
</body>
</html>

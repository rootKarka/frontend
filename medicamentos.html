<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmacia - Gestión de Medicamentos</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Regla estrictamente requerida para visibilidad por rol */
    .oculto {
      display: none !important;
    }

    /* Estilizado del Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(6px);
      z-index: 60;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    /* Estilizado adaptable para la tabla inyectada dinámicamente por JS */
    #tablaMedicamentos tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background-color 0.2s ease;
    }

    #tablaMedicamentos tr:hover {
      background-color: #f8fafc;
    }

    #tablaMedicamentos td {
      padding: 1rem 1.25rem;
      font-size: 0.875rem;
      color: #334155;
      vertical-align: middle;
    }

    #tablaMedicamentos td:first-child {
      font-weight: 600;
      color: #0f172a;
    }

    /* Estilos para los botones inyectados en las filas */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      padding: 0.45rem 0.85rem;
      font-size: 0.8125rem;
      font-weight: 500;
      border-radius: 0.625rem;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .btn-edit {
      background-color: #f59e0b;
      color: #ffffff;
      box-shadow: 0 1px 2px rgba(245, 158, 11, 0.2);
    }

    .btn-edit:hover {
      background-color: #d97706;
      box-shadow: 0 4px 8px rgba(217, 119, 6, 0.25);
      transform: translateY(-1px);
    }

    .btn-delete {
      background-color: #f43f5e;
      color: #ffffff;
      box-shadow: 0 1px 2px rgba(244, 63, 94, 0.2);
    }

    .btn-delete:hover {
      background-color: #e11d48;
      box-shadow: 0 4px 8px rgba(225, 29, 72, 0.25);
      transform: translateY(-1px);
    }

    .btn-add {
      background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
      color: white;
      padding: 0.65rem 1.25rem;
      font-weight: 600;
      border-radius: 0.75rem;
      box-shadow: 0 4px 10px rgba(13, 148, 136, 0.25);
      transition: all 0.2s ease;
    }

    .btn-add:hover {
      background: linear-gradient(135deg, #047857 0%, #0f766e 100%);
      box-shadow: 0 6px 15px rgba(13, 148, 136, 0.35);
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen text-slate-800 antialiased flex flex-col">

  <!-- Navigation Header -->
  <nav class="bg-slate-900 text-white shadow-lg sticky top-0 z-50 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        
        <!-- Izquierda: Marca y Enlaces de Navegación -->
        <div class="flex items-center gap-8">
          <a href="dashboard.html" class="flex items-center gap-3 group">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20 group-hover:scale-105 transition-transform">
              <i class="fa-solid fa-prescription-bottle-medical text-lg"></i>
            </div>
            <span class="font-bold text-lg text-white tracking-tight hidden sm:inline">PharmaSystem</span>
          </a>

          <div class="flex items-center gap-1 sm:gap-2">
            <a href="dashboard.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition-colors flex items-center gap-2">
              <i class="fa-solid fa-house text-xs"></i>
              <span>Inicio</span>
            </a>
            <a href="medicamentos.html" class="px-3 py-2 rounded-lg text-sm font-medium bg-slate-800 text-emerald-400 border border-slate-700/60 flex items-center gap-2">
              <i class="fa-solid fa-pills text-xs"></i>
              <span>Medicamentos</span>
            </a>
          </div>
        </div>

        <!-- Derecha: Nombre de usuario y Logout -->
        <div class="flex items-center gap-3">
          <div class="hidden sm:flex items-center gap-2.5 px-3.5 py-1.5 bg-slate-800/80 rounded-full border border-slate-700/80 text-xs text-slate-200">
            <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs">
              <i class="fa-solid fa-user text-[10px]"></i>
            </div>
            <!-- ID userName estrictamente preservado -->
            <span id="userName" class="font-medium text-slate-200">Cargando...</span>
          </div>

          <!-- Enlace de Logout con función logout() intacta -->
          <a href="#" onclick="logout()" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white transition-all duration-200 flex items-center gap-1.5 border border-rose-500/20 shadow-sm">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Cerrar Sesión</span>
          </a>
        </div>

      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Encabezado de Sección y Acción -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <div class="flex items-center gap-2 text-xs font-semibold text-emerald-600 uppercase tracking-wider mb-1">
          <i class="fa-solid fa-boxes-stacked"></i>
          <span>Inventario de Catálogo</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 tracking-tight">Gestión de Medicamentos</h1>
      </div>

      <!-- Botón de agregar medicamento con ID btnAgregar e icono visual -->
      <button id="btnAgregar" class="btn btn-add oculto" onclick="abrirModal()">
        <i class="fa-solid fa-plus"></i>
        <span>Nuevo Medicamento</span>
      </button>
    </div>

    <!-- Card de Tabla con Desplazamiento Responsivo -->
    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-200/80 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-900 text-slate-300 text-xs uppercase tracking-wider font-semibold border-b border-slate-800">
              <th class="py-4 px-5">ID</th>
              <th class="py-4 px-5">Nombre</th>
              <th class="py-4 px-5">Categoría</th>
              <th class="py-4 px-5">Precio</th>
              <th class="py-4 px-5">Stock</th>
              <th class="py-4 px-5 text-right">Acciones</th>
            </tr>
          </thead>
          <!-- ID tablaMedicamentos estrictamente preservado -->
          <tbody id="tablaMedicamentos">
            <!-- Cargado dinámicamente mediante JS -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Modal para Crear / Editar (ID modalForm estrictamente preservado) -->
  <div id="modalForm" class="modal">
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 max-w-md w-full p-6 sm:p-8 relative transform transition-all">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-100">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold">
            <i class="fa-solid fa-capsules text-lg"></i>
          </div>
          <!-- ID modalTitle preserved -->
          <h3 id="modalTitle" class="text-lg font-bold text-slate-800">Nuevo Medicamento</h3>
        </div>
        <button onclick="cerrarModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center transition-colors">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Inputs de Formulario (IDs estrictamente preservados) -->
      <div class="space-y-4">
        <input type="hidden" id="medId">

        <div>
          <label for="medNombre" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Nombre del Medicamento</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-prescription-bottle text-sm"></i>
            </div>
            <input 
              type="text" 
              id="medNombre" 
              placeholder="Ej. Paracetamol 500mg" 
              required
              class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200"
            >
          </div>
        </div>

        <div>
          <label for="medCategoria" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Categoría</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-tags text-sm"></i>
            </div>
            <select 
              id="medCategoria" 
              required
              class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200 appearance-none cursor-pointer"
            >
            </select>
            <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-chevron-down text-xs"></i>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="medPrecio" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Precio (S/)</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-coins text-sm"></i>
              </div>
              <input 
                type="number" 
                id="medPrecio" 
                placeholder="0.00" 
                step="0.01" 
                required
                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200"
              >
            </div>
          </div>

          <div>
            <label for="medStock" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Stock Disponible</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-cubes text-sm"></i>
              </div>
              <input 
                type="number" 
                id="medStock" 
                placeholder="Cantidad" 
                required
                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200"
              >
            </div>
          </div>
        </div>
      </div>

      <!-- Acciones de Modal -->
      <div class="flex items-center justify-end gap-3 mt-8 pt-4 border-t border-slate-100">
        <button 
          onclick="cerrarModal()" 
          class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs font-semibold transition-colors"
        >
          Cancelar
        </button>
        <button 
          onclick="guardarMedicamento()" 
          class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-700 hover:to-teal-600 text-white text-xs font-semibold shadow-md shadow-emerald-600/20 transition-all flex items-center gap-1.5"
        >
          <i class="fa-solid fa-floppy-disk text-xs"></i>
          <span>Guardar</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Script de soporte del backend -->
  <script src="app.js"></script>

  <!-- Lógica preservada idénticamente -->
  <script>
    const API_URL = 'https://TU_URL_DE_RENDER.onrender.com/api'; // ⚠️ CAMBIA ESTO POR TU URL DE RRENDER

    document.addEventListener('DOMContentLoaded', async () => {
      const usuario = JSON.parse(localStorage.getItem('usuario'));
      if (!usuario) return window.location.href = 'index.html';
      
      document.getElementById('userName').textContent = `${usuario.nombre} (${usuario.rol})`;
      
      // Mostrar botón de agregar solo si es admin o moderador
      if (usuario.rol === 'admin' || usuario.rol === 'moderador') {
        document.getElementById('btnAgregar').classList.remove('oculto');
      }

      await cargarCategorias();
      await cargarMedicamentos();
    });

    async function cargarCategorias() {
      const token = localStorage.getItem('token');
      const res = await fetch(`${API_URL}/medicamentos/categorias`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const categorias = await res.json();
      const select = document.getElementById('medCategoria');
      select.innerHTML = '<option value="">Seleccione categoría</option>' + 
        categorias.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
    }

    async function cargarMedicamentos() {
      const token = localStorage.getItem('token');
      const usuario = JSON.parse(localStorage.getItem('usuario'));
      const res = await fetch(`${API_URL}/medicamentos`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const meds = await res.json();
      const tbody = document.getElementById('tablaMedicamentos');
      
      tbody.innerHTML = meds.map(m => `
        <tr>
          <td>${m.id}</td>
          <td><span class="font-semibold text-slate-800">${m.nombre}</span></td>
          <td><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700">${m.Categoria ? m.Categoria.nombre : 'N/A'}</span></td>
          <td><span class="font-medium text-emerald-600">S/ ${m.precio.toFixed(2)}</span></td>
          <td>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${m.stock < 10 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">
              ${m.stock} unidades
            </span>
          </td>
          <td class="text-right">
            ${ (usuario.rol === 'admin' || usuario.rol === 'moderador') ? `
              <button class="btn btn-edit" onclick='editarMed(${JSON.stringify(m)})'><i class="fa-solid fa-pen-to-square"></i> Editar</button>
              <button class="btn btn-delete" onclick="eliminarMed(${m.id})"><i class="fa-solid fa-trash-can"></i> Eliminar</button>
            ` : '<span style="color:#888">Solo lectura</span>' }
          </td>
        </tr>
      `).join('');
    }

    // Alias explícito para asegurar compatibilidad total con el evento onclick del botón editar
    function editarMed(med) {
      abrirModal(med);
    }

    function abrirModal(med = null) {
      document.getElementById('modalForm').style.display = 'flex';
      document.getElementById('modalTitle').textContent = med ? 'Editar Medicamento' : 'Nuevo Medicamento';
      document.getElementById('medId').value = med ? med.id : '';
      document.getElementById('medNombre').value = med ? med.nombre : '';
      document.getElementById('medCategoria').value = med ? med.categoriaId : '';
      document.getElementById('medPrecio').value = med ? med.precio : '';
      document.getElementById('medStock').value = med ? med.stock : '';
    }

    function cerrarModal() {
      document.getElementById('modalForm').style.display = 'none';
    }

    async function guardarMedicamento() {
      const id = document.getElementById('medId').value;
      const data = {
        nombre: document.getElementById('medNombre').value,
        categoriaId: parseInt(document.getElementById('medCategoria').value),
        precio: parseFloat(document.getElementById('medPrecio').value),
        stock: parseInt(document.getElementById('medStock').value)
      };

      if (!data.nombre || !data.categoriaId || !data.precio || !data.stock) {
        return alert('Por favor completa todos los campos');
      }

      const token = localStorage.getItem('token');
      const url = id ? `${API_URL}/medicamentos/${id}` : `${API_URL}/medicamentos`;
      const method = id ? 'PUT' : 'POST';

      const res = await fetch(url, {
        method,
        headers: { 
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json' 
        },
        body: JSON.stringify(data)
      });

      if (res.ok) {
        cerrarModal();
        cargarMedicamentos();
      } else {
        const err = await res.json();
        alert('Error: ' + err.error);
      }
    }

    async function eliminarMed(id) {
      if (!confirm('¿Estás seguro de eliminar este medicamento?')) return;
      
      const token = localStorage.getItem('token');
      const res = await fetch(`${API_URL}/medicamentos/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (res.ok) {
        cargarMedicamentos();
      } else {
        alert('Error al eliminar');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('usuario');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
